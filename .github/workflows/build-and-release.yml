name: build-and-release

on:
  push:
    tags:
      - 'AliSQL-8.0.*'
      - 'AliSQL-5.7.*'

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      major:   ${{ steps.p.outputs.major }}
      minor:   ${{ steps.p.outputs.minor }}
      patch:   ${{ steps.p.outputs.patch }}
      extra:   ${{ steps.p.outputs.extra }}
    steps:
      - id: p
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#AliSQL-}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          REST="${REST#*.}"
          PATCH="${REST%%-*}"
          EXTRA="${REST#*-}"
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "patch=$PATCH"
            echo "extra=$EXTRA"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed: version=$VERSION major=$MAJOR minor=$MINOR patch=$PATCH extra=$EXTRA"

  build:
    needs: parse
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 复刻方案三的已验证配方：debian:11 + 系统 OpenSSL 1.1.1，bash build.sh，
      # 不注入版本号（VERSION 保持仓库原样 -> 干净 5.7.44），不做静态 SSL。
      # 产物动态链接 libssl.so.1.1，与 B 层 debian:11-slim 运行时天然匹配。
      - name: Build inside debian:11 (方案三 recipe, glibc2.31 + system OpenSSL 1.1.1)
        env:
          VER: ${{ needs.parse.outputs.version }}
        run: |
          set -eux
          mkdir -p "${GITHUB_WORKSPACE}/out"
          docker run --rm -i \
            -v "${GITHUB_WORKSPACE}:/AliSQL" \
            -v "${GITHUB_WORKSPACE}/out:/out" \
            -e VER \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:11-slim \
            bash -ex <<'INNER'

          # ---- Toolchain（与方案三 alisql57-image builder 一致）----
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --fix-missing --no-install-recommends \
            bison ca-certificates cmake curl g++ gcc git \
            libaio-dev libncurses-dev libnuma-dev libssl-dev \
            make perl pkg-config python3 xz-utils
          cmake --version

          # ---- Build & install（不改 VERSION，不传 WITH_SSL）----
          # 用 bash 跑：build.sh 用了 set -o pipefail。
          cd /AliSQL
          test -f VERSION
          echo "--- VERSION (未改动) ---"; cat VERSION
          bash build.sh -t release -d /opt/alisql
          make install
          echo "--- mysqld 版本 ---"; /opt/alisql/bin/mysqld --version

          # ---- Package ----
          cd /opt
          GLIBC="glibc$(ldd --version | awk 'NR==1{print $NF}')"
          ARCH="$(uname -m)"
          PKG="alisql-${VER}-linux-${GLIBC}-${ARCH}.tar.xz"
          TOPDIR="${PKG%.tar.xz}"
          XZ_OPT='-T0 -9' tar -cJf "/out/${PKG}" \
            --transform="s,^alisql,${TOPDIR}," \
            --exclude='alisql/mysql-test' \
            --exclude='alisql/run' \
            --exclude='alisql/var' \
            --exclude='alisql/LICENSE-test' \
            --exclude='alisql/LICENSE.router' \
            --exclude='alisql/README-test' \
            --exclude='alisql/README.router' \
            --exclude='alisql/mysqlrouter-log-rotate' \
            alisql/
          ls -lh "/out/${PKG}"
          INNER

      - uses: actions/upload-artifact@v4
        with:
          name: alisql-${{ matrix.arch }}
          path: ${{ github.workspace }}/out/alisql-*.tar.xz
          retention-days: 7

  release:
    needs: [parse, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release with tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ github.ref_name }}
          VERSION:  ${{ needs.parse.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Auto-built AliSQL ${VERSION} (debian:11, glibc 2.31, system OpenSSL 1.1.1 — 方案三 recipe). x86_64 and aarch64 binaries attached." \
            artifacts/*.tar.xz
